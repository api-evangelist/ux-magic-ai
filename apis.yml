description: UXMagic (UX Magic AI) is an AI UI/UX design platform that turns text prompts,
  screenshots, hand-drawn sketches, website URLs, and existing Figma files into pixel-perfect,
  Figma-ready UI designs and production-ready code. Built by UXMagic Inc. (founded 2024,
  Dover, Delaware; backed by 500 Global) and used by 50,000+ designers, it generates
  multi-screen flows, wireframes, and style guides, exports to Figma, Framer, Webflow,
  React, and HTML/Tailwind, and ships a hosted MCP server (api.uxmagic.ai/api/mcp) plus
  an npm stdio bridge so AI agents in Cursor, VS Code, Windsurf, and Claude can read,
  generate, and edit designs with scoped API keys.
